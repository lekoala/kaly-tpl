name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          ini-values: zend.assertions=1
          extensions: zip
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Mago Format Check
        run: composer mago:format

      - name: Mago Lint
        if: success() || failure()
        run: composer mago:lint

      - name: PHPStan
        if: success() || failure()
        run: composer phpstan

  test:
    name: PHPUnit PHP ${{ matrix.php }}${{ matrix.variant && format(' ({0})', matrix.variant) || '' }}
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
        extensions: ["zip"]
        composer-flags: [""]
        include:
          # ext-intl is optional: cover the neutral formatting fallbacks.
          - php: "8.5"
            extensions: "zip, :intl"
            composer-flags: ""
            variant: "without intl"
          - php: "8.3"
            extensions: "zip"
            composer-flags: "--prefer-lowest --prefer-stable"
            variant: "lowest"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          ini-values: zend.assertions=1
          extensions: ${{ matrix.extensions }}
          coverage: none
          tools: composer:v2

      - name: Get Composer Cache Directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.php }}-${{ matrix.variant }}-${{ hashFiles('composer.json') }}
          restore-keys: ${{ runner.os }}-composer-${{ matrix.php }}-

      - name: Composer update
        run: composer update --no-interaction --no-progress --prefer-dist --optimize-autoloader ${{ matrix.composer-flags }}

      - name: PHPUnit
        run: composer phpunit
